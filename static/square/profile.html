<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>用户资料 - 云己</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#1877F2',
                        secondary: '#4267B2',
                        accent: '#F5F6F7',
                        dark: '#365899',
                    },
                    fontFamily: {
                        sans: ['Inter', 'system-ui', 'sans-serif'],
                    },
                },
            }
        }
    </script>
    <style type="text/tailwindcss">
        @layer utilities {
            .content-auto {
                content-visibility: auto;
            }
            .scrollbar-hide {
                -ms-overflow-style: none;
                scrollbar-width: none;
            }
            .scrollbar-hide::-webkit-scrollbar {
                display: none;
            }
        }
    </style>
</head>
<body class="bg-gray-100 font-sans">
    <!-- 顶部导航栏 -->
    <header class="sticky top-0 z-50 bg-white shadow-md">
        <div class="container mx-auto px-4">
            <div class="flex items-center justify-between h-16">
                <div class="flex items-center">
                    <a href="index.html" class="flex items-center space-x-2">
                        <span class="text-2xl font-bold text-primary">云己</span>
                    </a>
                </div>
                <div class="hidden md:flex items-center space-x-8">
                    <a href="index.html" class="text-gray-600 hover:text-primary transition-colors">首页</a>
                    <a href="javascript:navigateTo('square')" class="text-gray-600 hover:text-primary transition-colors">广场</a>
                    <a href="index.html#discover" class="text-gray-600 hover:text-primary transition-colors">发现</a>
                </div>
                <div class="flex items-center space-x-4">
                    <button id="followBtn" class="bg-primary hover:bg-primary/90 text-white py-2 px-6 rounded-full transition-colors">
                        <i class="fa fa-plus mr-2"></i>关注
                    </button>
                    <button id="messageBtn" class="bg-gray-200 hover:bg-gray-300 text-gray-800 py-2 px-6 rounded-full transition-colors">
                        <i class="fa fa-envelope mr-2"></i>发消息
                    </button>
                </div>
            </div>
        </div>
    </header>

    <!-- 个人资料头部 -->
    <section class="bg-gradient-to-r from-blue-700 to-purple-800 text-white">
        <div class="container mx-auto px-4">
            <div class="pt-16 pb-20">
                <div class="flex flex-col md:flex-row">
                    <img id="profileAvatar" src="https://picsum.photos/seed/user456/400/400" alt="用户头像" class="w-36 h-36 rounded-full border-4 border-white mx-auto md:mx-0">
                    <div class="mt-6 md:mt-0 md:ml-8">
                        <h1 id="userName" class="text-3xl md:text-4xl font-bold">访客用户</h1>
                        <p id="userBio" class="text-xl mt-2 opacity-90">暂无个人简介</p>
                        <div class="flex flex-wrap gap-4 mt-4">
                            <button id="shareBtn" class="bg-white text-primary hover:bg-gray-100 py-2 px-6 rounded-full transition-colors flex items-center">
                                <i class="fa fa-share mr-2"></i>分享主页
                            </button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </section>

    <!-- 生命天数卡片 -->
    <section class="bg-white shadow-md -mt-8 relative z-10">
        <div class="container mx-auto px-4">
            <div class="py-6 flex flex-col md:flex-row items-center justify-between">
                <div class="text-center md:text-left">
                    <p class="text-xl font-medium text-gray-800">
                        生命的第 <span id="lifeDayCount" class="text-primary font-bold text-2xl">0</span> 天
                    </p>
                    <p class="text-gray-500 mt-1">出生于 <span id="birthDate">1990-01-01</span></p>
                </div>
                <div class="flex space-x-6 mt-4 md:mt-0">
                    <div class="text-center">
                        <p id="thoughtCount" class="text-2xl font-bold text-gray-800">0</p>
                        <p class="text-gray-500">思想元胞</p>
                    </div>
                    <div class="text-center">
                        <p id="followingCount" class="text-2xl font-bold text-gray-800">0</p>
                        <p class="text-gray-500">关注</p>
                    </div>
                    <div class="text-center">
                        <p id="followerCount" class="text-2xl font-bold text-gray-800">0</p>
                        <p class="text-gray-500">粉丝</p>
                    </div>
                </div>
            </div>
        </div>
    </section>

    <!-- 主内容区 -->
    <div class="container mx-auto px-4 py-8">
        <div class="flex flex-col lg:flex-row gap-8">
            <!-- 左侧边栏 -->
            <aside class="lg:w-1/4 lg:sticky lg:top-24 lg:self-start">
                <!-- 个人信息卡片 -->
                <div class="bg-white rounded-xl shadow-md overflow-hidden mb-8">
                    <div class="p-6">
                        <h3 class="text-lg font-bold text-gray-900 mb-4">个人信息</h3>
                        <div id="profileInfo" class="space-y-3">
                            <div class="flex items-start space-x-3">
                                <i class="fa fa-user text-primary mt-1"></i>
                                <div>
                                    <p class="text-sm text-gray-500">昵称</p>
                                    <p id="infoName" class="text-gray-900">访客用户</p>
                                </div>
                            </div>
                            <div class="flex items-start space-x-3">
                                <i class="fa fa-map-marker text-primary mt-1"></i>
                                <div>
                                    <p class="text-sm text-gray-500">所在地</p>
                                    <p id="infoLocation" class="text-gray-900">北京市</p>
                                </div>
                            </div>
                            <div class="flex items-start space-x-3">
                                <i class="fa fa-briefcase text-primary mt-1"></i>
                                <div>
                                    <p class="text-sm text-gray-500">职业</p>
                                    <p id="infoOccupation" class="text-gray-900">数字生命探索者</p>
                                </div>
                            </div>
                            <div class="flex items-start space-x-3">
                                <i class="fa fa-calendar text-primary mt-1"></i>
                                <div>
                                    <p class="text-sm text-gray-500">出生日期</p>
                                    <p id="infoBirthdate" class="text-gray-900">1990-01-01</p>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- 标签云 -->
                <div class="bg-white rounded-xl shadow-md overflow-hidden">
                    <div class="p-6">
                        <h3 class="text-lg font-bold text-gray-800 mb-4">兴趣标签</h3>
                        <div id="interestTags" class="flex flex-wrap gap-2">
                            <span class="bg-blue-100 text-blue-700 px-3 py-1 rounded-full text-sm">#数字永生</span>
                            <span class="bg-blue-100 text-blue-700 px-3 py-1 rounded-full text-sm">#人工智能</span>
                            <span class="bg-blue-100 text-blue-700 px-3 py-1 rounded-full text-sm">#哲学思考</span>
                        </div>
                    </div>
                </div>
            </aside>

            <!-- 右侧内容区 -->
            <div class="lg:w-3/4">
                <!-- 思想元胞列表 -->
                <div class="bg-white rounded-xl shadow-md overflow-hidden">
                    <div class="p-6">
                        <div class="flex items-center justify-between mb-6">
                            <h2 class="text-xl font-bold text-gray-900">思想元胞</h2>
                            <div class="flex space-x-2">
                                <button class="text-primary hover:text-secondary transition-colors">
                                    <i class="fa fa-th-large"></i>
                                </button>
                                <button class="text-gray-400 hover:text-gray-600 transition-colors">
                                    <i class="fa fa-list"></i>
                                </button>
                            </div>
                        </div>

                        <!-- 筛选工具栏 -->
                        <div class="flex flex-wrap gap-2 mb-6">
                            <button class="bg-primary text-white px-4 py-2 rounded-full text-sm">全部</button>
                            <button class="bg-gray-100 text-gray-700 px-4 py-2 rounded-full text-sm hover:bg-gray-200 transition-colors">最新</button>
                            <button class="bg-gray-100 text-gray-700 px-4 py-2 rounded-full text-sm hover:bg-gray-200 transition-colors">热门</button>
                            <button class="bg-gray-100 text-gray-700 px-4 py-2 rounded-full text-sm hover:bg-gray-200 transition-colors">收藏</button>
                        </div>

                        <!-- 思想元胞容器 -->
                        <div id="thoughtsContainer" class="space-y-6">
                            <!-- 思想元胞将在这里动态加载 -->
                        </div>

                        <!-- 空状态卡片 -->
                        <div id="emptyThoughtsCard" class="bg-white border border-gray-200 rounded-xl p-8 text-center shadow-sm">
                            <div class="w-16 h-16 bg-blue-100 rounded-full flex items-center justify-center mx-auto mb-4">
                                <i class="fa fa-lightbulb-o text-2xl text-blue-600"></i>
                            </div>
                            <h3 class="text-xl font-bold text-gray-900 mb-2">该用户还没有发布任何思想元胞</h3>
                            <p class="text-gray-600">当用户发布思想元胞时，它们会在这里显示。</p>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // 全局变量
        let targetUser = {};
        let userThoughtCells = [];
        let isFollowing = false;

        // 页面加载完成后初始化
        document.addEventListener('DOMContentLoaded', function() {
            loadTargetUserData();
            loadUserThoughtCells();
            initEventListeners();
        });

        // 加载目标用户数据
        async function loadTargetUserData() {
            try {
                // 模拟目标用户数据（实际应该从URL参数或API获取）
                targetUser = getMockUserData();
                updateUserProfile();
                loadUserStats();
            } catch (error) {
                console.error('加载用户数据失败:', error);
                targetUser = getMockUserData();
                updateUserProfile();
            }
        }

        // 获取模拟用户数据
        function getMockUserData() {
            return {
                user_id: 'target_user',
                username: '数字生命探索者',
                avatar: 'https://picsum.photos/seed/user456/400/400',
                bio: '致力于思想的永恒保存和数字生命的探索',
                location: '北京市',
                occupation: '数字生命探索者',
                birthdate: '1990-01-01',
                interests: '哲学, 科技, 人工智能',
                tags: ['数字永生', '人工智能', '哲学思考', '意识研究'],
                stats: {
                    thoughtCount: 12,
                    followingCount: 25,
                    followerCount: 156
                }
            };
        }

        // 更新用户资料显示
        function updateUserProfile() {
            document.getElementById('userName').textContent = targetUser.username;
            document.getElementById('userBio').textContent = targetUser.bio;
            document.getElementById('profileAvatar').src = targetUser.avatar;
            
            // 更新个人信息卡片
            document.getElementById('infoName').textContent = targetUser.username;
            document.getElementById('infoLocation').textContent = targetUser.location;
            document.getElementById('infoOccupation').textContent = targetUser.occupation;
            document.getElementById('infoBirthdate').textContent = targetUser.birthdate;
            
            // 更新生命天数
            if (targetUser.birthdate) {
                updateLifeDayCount(targetUser.birthdate);
                document.getElementById('birthDate').textContent = targetUser.birthdate;
            }
            
            // 更新标签云
            updateTagCloud(targetUser.tags);
        }

        // 更新标签云
        function updateTagCloud(tags) {
            const container = document.getElementById('interestTags');
            container.innerHTML = '';
            
            tags.forEach(tag => {
                const tagElement = document.createElement('span');
                tagElement.className = 'bg-blue-100 text-blue-700 px-3 py-1 rounded-full text-sm';
                tagElement.textContent = `#${tag}`;
                container.appendChild(tagElement);
            });
        }

        // 更新生命天数
        function updateLifeDayCount(birthdate) {
            const birth = new Date(birthdate);
            const today = new Date();
            const diffTime = Math.abs(today - birth);
            const diffDays = Math.ceil(diffTime / (1000 * 60 * 60 * 24));
            document.getElementById('lifeDayCount').textContent = diffDays;
        }

        // 加载用户统计数据
        function loadUserStats() {
            if (targetUser.stats) {
                document.getElementById('thoughtCount').textContent = targetUser.stats.thoughtCount;
                document.getElementById('followingCount').textContent = targetUser.stats.followingCount;
                document.getElementById('followerCount').textContent = targetUser.stats.followerCount;
            }
        }

        // 加载用户的思想元胞
        function loadUserThoughtCells() {
            try {
                // 模拟目标用户的思想元胞数据
                userThoughtCells = getMockThoughtCells();
                renderThoughtCells(userThoughtCells);
            } catch (error) {
                console.error('加载思想元胞失败:', error);
                renderThoughtCells([]);
            }
        }

        // 获取模拟思想元胞数据
        function getMockThoughtCells() {
            return [
                {
                    id: 'mock_thought_1',
                    userId: targetUser.user_id,
                    username: targetUser.username,
                    avatar: targetUser.avatar,
                    content: '今天思考了数字生命的意义。我们的思想和记忆，是否可以通过数字化的方式得到永恒？\n\n也许真正的永恒不在于肉体的延续，而在于思想的传承。',
                    quote: '"我思故我在" - 笛卡尔',
                    tags: ['数字生命', '哲学思考', '永恒'],
                    images: ['https://picsum.photos/seed/digital_life/800/400'],
                    imprinted: false,
                    imprintCount: 5,
                    createdAt: new Date(Date.now() - 86400000).toISOString()
                },
                {
                    id: 'mock_thought_2',
                    userId: targetUser.user_id,
                    username: targetUser.username,
                    avatar: targetUser.avatar,
                    content: '人工智能的发展让我们重新思考什么是意识。\n\n当AI能够模拟人类的思维过程时，我们是否还需要坚持意识必须基于生物基础？',
                    quote: '',
                    tags: ['人工智能', '意识研究'],
                    images: [],
                    imprinted: true,
                    imprintCount: 12,
                    createdAt: new Date(Date.now() - 172800000).toISOString()
                },
                {
                    id: 'mock_thought_3',
                    userId: targetUser.user_id,
                    username: targetUser.username,
                    avatar: targetUser.avatar,
                    content: '数字永生不仅仅是数据的保存，更是意识的延续。\n\n我们需要重新定义什么是"活着"。',
                    quote: '"死亡并不是失去生命，而是走出了时间" - 余华',
                    tags: ['数字永生', '生命意义'],
                    images: ['https://picsum.photos/seed/consciousness/800/400'],
                    imprinted: false,
                    imprintCount: 8,
                    createdAt: new Date(Date.now() - 259200000).toISOString()
                }
            ];
        }

        // 渲染思想元胞
        function renderThoughtCells(thoughtCells) {
            const container = document.getElementById('thoughtsContainer');
            const emptyCard = document.getElementById('emptyThoughtsCard');
            
            container.innerHTML = '';
            
            if (thoughtCells.length === 0) {
                emptyCard.classList.remove('hidden');
                return;
            }
            
            emptyCard.classList.add('hidden');
            
            thoughtCells.forEach(thought => {
                addThoughtCellToPage(thought);
            });
        }

        // 将思想元胞添加到页面
        function addThoughtCellToPage(thoughtCell) {
            const container = document.getElementById('thoughtsContainer');
            
            const thoughtElement = document.createElement('div');
            thoughtElement.className = 'bg-white rounded-xl shadow-md overflow-hidden';
            
            let contentHTML = `
                <div class="p-6">
                    <div class="flex items-start space-x-4">
                        <img src="${thoughtCell.avatar}" alt="用户头像" class="w-12 h-12 rounded-full">
                        <div class="flex-1">
                            <div class="flex justify-between items-start">
                                <div>
                                    <h4 class="font-bold text-gray-800">${thoughtCell.username}</h4>
                                    <p class="text-gray-500 text-sm">${formatDate(thoughtCell.createdAt)}</p>
                                </div>
                                <div class="flex space-x-2">
                                    <button class="text-gray-400 hover:text-blue-500 transition-colors" onclick="starThought('${thoughtCell.id}')">
                                        <i class="fa fa-star-o"></i>
                                    </button>
                                    <button class="text-gray-400 hover:text-gray-600 transition-colors">
                                        <i class="fa fa-ellipsis-h"></i>
                                    </button>
                                </div>
                            </div>
                            
                            <div class="mt-4">
                                <p class="text-gray-800 leading-relaxed whitespace-pre-line">${thoughtCell.content}</p>
                                ${thoughtCell.quote ? `<p class="text-gray-600 italic mt-3 border-l-2 border-gray-200 pl-3">"${thoughtCell.quote}"</p>` : ''}
                                ${thoughtCell.images && thoughtCell.images.length > 0 ? `
                                    <div class="mt-4 bg-gray-100 rounded-lg p-2">
                                        <img src="${thoughtCell.images[0]}" alt="思想元胞图片" class="w-full h-auto rounded">
                                    </div>
                                ` : ''}
                                ${thoughtCell.tags && thoughtCell.tags.length > 0 ? `
                                    <div class="mt-3 flex flex-wrap gap-2">
                                        ${thoughtCell.tags.map(tag => `<span class="bg-gray-100 text-gray-700 px-2 py-1 rounded-full text-xs">#${tag}</span>`).join('')}
                                    </div>
                                ` : ''}
                            </div>
                            
                            <div class="mt-4 flex justify-between items-center pt-3 border-t border-gray-100">
                                <div class="flex items-center space-x-5">
                                    <button class="flex items-center text-gray-500 hover:text-red-500 transition-colors" onclick="likeThought('${thoughtCell.id}')">
                                        <i class="fa fa-heart-o mr-1 text-sm"></i>
                                        <span class="text-xs">喜欢</span>
                                    </button>
                                    <button class="flex items-center text-gray-500 hover:text-blue-500 transition-colors" onclick="commentThought('${thoughtCell.id}')">
                                        <i class="fa fa-comment-o mr-1 text-sm"></i>
                                        <span class="text-xs">评论</span>
                                    </button>
                                    <button class="flex items-center text-gray-500 hover:text-green-500 transition-colors" onclick="shareThought('${thoughtCell.id}')">
                                        <i class="fa fa-share-alt mr-1 text-sm"></i>
                                        <span class="text-xs">分享</span>
                                    </button>
                                </div>
                                <div class="flex items-center text-gray-500 text-xs">
                                    <i class="fa fa-star mr-1 text-yellow-500"></i>
                                    <span>${thoughtCell.imprintCount} 人标记</span>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            `;
            
            thoughtElement.innerHTML = contentHTML;
            container.appendChild(thoughtElement);
        }

        // 初始化事件监听器
        function initEventListeners() {
            // 关注按钮
            document.getElementById('followBtn').addEventListener('click', toggleFollow);
            
            // 发消息按钮
            document.getElementById('messageBtn').addEventListener('click', function() {
                alert('发消息功能开发中...');
            });
            
            // 分享按钮
            document.getElementById('shareBtn').addEventListener('click', function() {
                alert('分享功能开发中...');
            });
        }

        // 切换关注状态
        function toggleFollow() {
            const followBtn = document.getElementById('followBtn');
            const followerCount = document.getElementById('followerCount');
            
            isFollowing = !isFollowing;
            
            if (isFollowing) {
                followBtn.innerHTML = '<i class="fa fa-check mr-2"></i>已关注';
                followBtn.classList.remove('bg-primary', 'hover:bg-primary/90');
                followBtn.classList.add('bg-gray-200', 'hover:bg-gray-300', 'text-gray-800');
                
                // 更新粉丝数
                const currentCount = parseInt(followerCount.textContent);
                followerCount.textContent = currentCount + 1;
                
                alert('关注成功！');
            } else {
                followBtn.innerHTML = '<i class="fa fa-plus mr-2"></i>关注';
                followBtn.classList.remove('bg-gray-200', 'hover:bg-gray-300', 'text-gray-800');
                followBtn.classList.add('bg-primary', 'hover:bg-primary/90');
                
                // 更新粉丝数
                const currentCount = parseInt(followerCount.textContent);
                followerCount.textContent = Math.max(0, currentCount - 1);
                
                alert('已取消关注');
            }
        }

        // 星星标记功能
        function starThought(thoughtId) {
            const thought = userThoughtCells.find(t => t.id === thoughtId);
            if (!thought) return;
            
            if (thought.imprinted) {
                alert('您已经标记过这个思想元胞了');
                return;
            }
            
            thought.imprinted = true;
            thought.imprintCount++;
            
            // 重新渲染
            renderThoughtCells(userThoughtCells);
            
            alert('已标记这个思想元胞！');
        }

        // 喜欢功能
        function likeThought(thoughtId) {
            alert('喜欢功能开发中...');
        }

        // 评论功能
        function commentThought(thoughtId) {
            alert('评论功能开发中...');
        }

        // 分享功能
        function shareThought(thoughtId) {
            alert('分享功能开发中...');
        }

        // 格式化时间
        function formatDate(dateString) {
            const date = new Date(dateString);
            const now = new Date();
            const diff = now - date;
            const seconds = Math.floor(diff / 1000);
            const minutes = Math.floor(seconds / 60);
            const hours = Math.floor(minutes / 60);
            const days = Math.floor(hours / 24);
            
            if (days > 0) return `${days}天前`;
            if (hours > 0) return `${hours}小时前`;
            if (minutes > 0) return `${minutes}分钟前`;
            return '刚刚';
        }
    </script>

    <!-- API配置和用户认证 -->
    <script src="./js/api-config.js"></script>
</body>
</html>
